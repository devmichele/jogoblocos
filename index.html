<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <meta name="viewport"
          content="width=device-width,
          height=device-height,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no"/>

    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

    <meta http-equiv="pragma" content="no-cache"/>

    <title>Meu Jogo</title>

    <style>

        html, body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }

        body {

            display: flex;

            justify-content: center;
            align-items: center;
        }

        #gm4html5_div_id {

            width: 100vw;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        canvas {

            display: block;

            margin: auto;

            border: 0;
            padding: 0;

            touch-action: none;

            image-rendering: auto;

            image-rendering: optimizeSpeed;

            -webkit-interpolation-mode: nearest-neighbor;

            max-width: 100%;
            max-height: 100%;
        }

        :-webkit-full-screen canvas {

            width: auto !important;
            height: auto !important;
        }

    </style>

</head>

<body>

    <div id="gm4html5_div_id">

        <canvas id="canvas" width="1024" height="768">

            Seu navegador não suporta HTML5.

        </canvas>

    </div>

    <script type="text/javascript" src="html5game/juntablocos.js?cachebust=1616893754"></script>

    <script>

        function resizeGame() {

            const canvas = document.getElementById("canvas");

            const gameWidth = 1024;
            const gameHeight = 768;

            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const scale = Math.min(
                windowWidth / gameWidth,
                windowHeight / gameHeight
            );

            const newWidth = gameWidth * scale;
            const newHeight = gameHeight * scale;

            canvas.style.width = newWidth + "px";
            canvas.style.height = newHeight + "px";
        }

        window.addEventListener("resize", resizeGame);

        window.addEventListener("orientationchange", resizeGame);

        window.onload = function () {

            GameMaker_Init();

            resizeGame();
        };

    </script>

</body>

</html>
